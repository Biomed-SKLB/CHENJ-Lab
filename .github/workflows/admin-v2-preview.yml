name: Admin v2 preview package

on:
  pull_request:
    paths:
      - "admin-v2/**"
      - "admin.css"
      - "members.html"
      - "news.html"
      - "site-content.js"
      - "site-config.js"
      - "supabase/schema.sql"
      - "scripts/check-admin-v2.mjs"
      - ".github/workflows/admin-v2-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          find admin-v2 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check site-content.js
          node --check site-config.js

      - name: Contract checks
        run: node scripts/check-admin-v2.mjs

      - name: HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory . > /tmp/admin-v2-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --silent --fail http://127.0.0.1:8080/admin-v2/index.html > /dev/null; then
              break
            fi
            sleep 1
          done

          resources=(
            "admin-v2/index.html"
            "admin-v2/app.js"
            "admin-v2/auth.js"
            "admin-v2/database.js"
            "admin-v2/upload.js"
            "admin-v2/members.js"
            "admin-v2/announcements.js"
            "admin-v2/member-editor.js"
            "admin-v2/announcement-editor.js"
            "admin-v2/utils.js"
            "admin.css"
            "members.html"
            "news.html"
            "site-content.js"
            "site-config.js"
            "supabase/schema.sql"
          )

          for resource in "${resources[@]}"; do
            echo "Checking /$resource"
            curl --silent --show-error --fail "http://127.0.0.1:8080/$resource" > /dev/null
          done

      - name: Create preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/admin-v2
          cp -R admin-v2/. preview/admin-v2/
          cp admin.css site-config.js members.html index.html preview/
          cat > preview/PREVIEW-README.txt <<'EOF'
          CHENJ-Lab Admin v2 preview

          1. Serve this directory over HTTP; do not open the HTML through file://.
          2. Example: python3 -m http.server 8080 --directory preview
          3. Open: http://127.0.0.1:8080/admin-v2/
          4. This package uses the repository's public Supabase configuration.
          5. Database writes still require an authenticated account listed in site_admins.
          EOF
          test -f preview/admin-v2/index.html
          test -f preview/admin.css
          test -f preview/site-config.js
          test -f preview/members.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-v2-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7

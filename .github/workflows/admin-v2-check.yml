name: Admin v2 checks

on:
  pull_request:
    paths:
      - "admin-v2/**"
      - "scripts/check-admin-v2.mjs"
      - ".github/workflows/admin-v2-check.yml"
  push:
    branches:
      - "agent/admin-v2-foundation"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: find admin-v2 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check admin v2 contracts
        run: node scripts/check-admin-v2.mjs
